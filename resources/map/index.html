      function attachVertexHandles(layerId, featureIdx) {
        clearVertexHandles();
        var lObj = vectorLayers[layerId];
        if (!lObj || !lObj.indexMap) return;
        var target = lObj.indexMap[featureIdx];
        if (!target) return;

        vertexEditActive = true;
        vertexEditLayerId = layerId;
        vertexEditFeatureIdx = featureIdx;

        var btnEdit = document.getElementById("btnEditGeom");
        if (btnEdit) btnEdit.classList.add("active");

        var shapes = [];
        if (target.eachLayer && !(target instanceof L.Polyline)) {
          target.eachLayer(function (child) {
            shapes.push(child);
          });
        } else {
          shapes.push(target);
        }

        shapes.forEach(function (subLayer) {
          attachHandlesToSubLayer(subLayer, featureIdx);
        });
      }

      function attachHandlesToSubLayer(subLayer, featureIdx) {
        if (subLayer.getLatLng && !subLayer.getLatLngs) {
          var pt = subLayer.getLatLng();
          var m = L.marker(pt, {
            draggable: true,
            icon: L.divIcon({
              className: "vertex-handle-icon",
              html: '<div class="vertex-handle-inner"></div>',
              iconSize: [12, 12],
              iconAnchor: [6, 6],
            }),
            zIndexOffset: 10000,
          }).addTo(map);

          m.on("drag", function () {
            subLayer.setLatLng(m.getLatLng());
          });

          m.on("dragend", function () {
            var newPos = m.getLatLng();
            subLayer.setLatLng(newPos);
            var geom = {
              type: "Point",
              coordinates: [newPos.lng, newPos.lat],
            };
            notifyFeatureUpdated(featureIdx, geom);
          });

          vertexMarkers.push(m);
          return;
        }

        if (subLayer.getLatLngs) {
          var rawLatLngs = subLayer.getLatLngs();
          var isPoly = subLayer instanceof L.Polygon;

          if (isPoly) {
            var rings = Array.isArray(rawLatLngs[0])
              ? rawLatLngs
              : [rawLatLngs];
            rings.forEach(function (ring, rIdx) {
              ring.forEach(function (pt, pIdx) {
                var m = L.marker(pt, {
                  draggable: true,
                  icon: L.divIcon({
                    className: "vertex-handle-icon",
                    html: '<div class="vertex-handle-inner"></div>',
                    iconSize: [12, 12],
                    iconAnchor: [6, 6],
                  }),
                  zIndexOffset: 10000,
                }).addTo(map);

                m.on("drag", function () {
                  ring[pIdx] = m.getLatLng();
                  subLayer.setLatLngs(rawLatLngs);
                });

                m.on("dragend", function () {
                  ring[pIdx] = m.getLatLng();
                  subLayer.setLatLngs(rawLatLngs);
                  var polyCoords = rings.map(function (r) {
                    var pts = r.map(function (p) {
                      return [p.lng, p.lat];
                    });
                    if (pts.length > 0) {
                      var first = pts[0];
                      var last = pts[pts.length - 1];
                      if (first[0] !== last[0] || first[1] !== last[1]) {
                        pts.push([first[0], first[1]]);
                      }
                    }
                    return pts;
                  });
                  var geom = {
                    type: "Polygon",
                    coordinates: polyCoords,
                  };
                  notifyFeatureUpdated(featureIdx, geom);
                });

                vertexMarkers.push(m);
              });
            });
          } else {
            var isMultiLine = Array.isArray(rawLatLngs[0]);
            var lineParts = isMultiLine ? rawLatLngs : [rawLatLngs];

            lineParts.forEach(function (part, partIdx) {
              part.forEach(function (pt, pIdx) {
                var m = L.marker(pt, {
                  draggable: true,
                  icon: L.divIcon({
                    className: "vertex-handle-icon",
                    html: '<div class="vertex-handle-inner"></div>',
                    iconSize: [12, 12],
                    iconAnchor: [6, 6],
                  }),
                  zIndexOffset: 10000,
                }).addTo(map);

                m.on("drag", function () {
                  part[pIdx] = m.getLatLng();
                  subLayer.setLatLngs(rawLatLngs);
                });

                m.on("dragend", function () {
                  part[pIdx] = m.getLatLng();
                  subLayer.setLatLngs(rawLatLngs);
                  var geom;
                  if (isMultiLine) {
                    geom = {
                      type: "MultiLineString",
                      coordinates: lineParts.map(function (lp) {
                        return lp.map(function (p) {
                          return [p.lng, p.lat];
                        });
                      }),
                    };
                  } else {
                    geom = {
                      type: "LineString",
                      coordinates: part.map(function (p) {
                        return [p.lng, p.lat];
                      }),
                    };
                  }
                  notifyFeatureUpdated(featureIdx, geom);
                });

                vertexMarkers.push(m);
              });
            });
          }
        }
      }

      var measureActive = false;
      var measurePoints = [];
      var measureMarkers = [];
      var measureLine = null;
      var measurePolygon = null;
      var measureTooltip = null;

      function toggleMeasure() {
        if (typeof finishVertexEditMode === "function") finishVertexEditMode();
        measureActive = !measureActive;
        var btn = document.getElementById("btnMeasure");
        if (btn) btn.classList.toggle("active", measureActive);
        if (!measureActive) {
          clearMeasure();
        } else {
          cancelDrawMode();
          if (selectMode === "box") setSelectTool("click");
          closeAllFlyouts();
        }
      }

      function clearMeasure() {
        measurePoints = [];
        measureMarkers.forEach(function (m) {
          map.removeLayer(m);
        });
        measureMarkers = [];
        if (measureLine) map.removeLayer(measureLine);
        if (measurePolygon) map.removeLayer(measurePolygon);
        if (measureTooltip) map.removeLayer(measureTooltip);
        measureLine = null;
        measurePolygon = null;
        measureTooltip = null;
      }

      var mapMouseDownPos = null;
      var mapMouseDownTime = 0;
      map.on("mousedown", function (e) {
        if (e.containerPoint) {
          mapMouseDownPos = e.containerPoint;
          mapMouseDownTime = Date.now();
        }
        if (drawMode || measureActive) return;
        if (e.originalEvent && e.originalEvent.button !== 0) return;

        var isShift = e.originalEvent && e.originalEvent.shiftKey;
        if (selectMode === "box" || isShift) {
          isBoxSelecting = true;
          map.dragging.disable();
          boxStartLatLng = e.latlng;
          if (boxRectLayer) {
            map.removeLayer(boxRectLayer);
            boxRectLayer = null;
          }
          boxRectLayer = L.rectangle([boxStartLatLng, boxStartLatLng], {
            color: "#0078d4",
            weight: 1.5,
            dashArray: "4, 4",
            fillColor: "#0078d4",
            fillOpacity: 0.15,
          }).addTo(map);
        }
      });

      map.on("mouseup", function (e) {
        var dist = 0;
        if (mapMouseDownPos && e.containerPoint) {
          dist = Math.hypot(
            e.containerPoint.x - mapMouseDownPos.x,
            e.containerPoint.y - mapMouseDownPos.y,
          );
        }
        var mDownPos = mapMouseDownPos;
        mapMouseDownPos = null;

        if (drawMode || measureActive) return;
        if (e.originalEvent && e.originalEvent.button !== 0) return;
        if (e.originalEvent && e.originalEvent.detail > 1) return;

        if (isBoxSelecting) {
          isBoxSelecting = false;
          if (selectMode !== "box") {
            map.dragging.enable();
          }
          if (boxRectLayer) {
            map.removeLayer(boxRectLayer);
            boxRectLayer = null;
          }

          if (dist >= 5 && boxStartLatLng) {
            var boxBounds = L.latLngBounds(boxStartLatLng, e.latlng);
            var lObj = vectorLayers[activeLayerId];
            if (!lObj || !lObj.leafletLayer) return;

            var isMulti =
              e.originalEvent &&
              (e.originalEvent.ctrlKey || e.originalEvent.metaKey);
            if (!isMulti) {
              selectedIndices.clear();
            }

            lObj.leafletLayer.eachLayer(function (l) {
              var idx = l._featureIdx;
              if (idx === undefined) return;
              var hit = false;
              if (l.getBounds && l.getBounds().isValid()) {
                hit = boxBounds.intersects(l.getBounds());
              } else if (l.getLatLng) {
                hit = boxBounds.contains(l.getLatLng());
              }
              if (!hit && l.eachLayer) {
                l.eachLayer(function (child) {
                  if (child.getBounds && child.getBounds().isValid()) {
                    if (boxBounds.intersects(child.getBounds())) hit = true;
                  } else if (child.getLatLng) {
                    if (boxBounds.contains(child.getLatLng())) hit = true;
                  }
                });
              }
              if (hit) {
                selectedIndices.add(idx);
              }
            });

            refreshLayerStyles(activeLayerId);
            notifySelectionChanged();
            return;
          } else {
            if (activeLayerId && vectorLayers[activeLayerId]) {
              var hit = findFeatureAtPoint(
                e.containerPoint,
                e.latlng,
                activeLayerId,
              );
              if (hit) {
                handleFeatureClick(
                  hit.idx,
                  activeLayerId,
                  hit.feature,
                  hit.layer,
                  e,
                );
                return;
              } else {
                var isMulti =
                  e.originalEvent &&
                  (e.originalEvent.ctrlKey ||
                    e.originalEvent.shiftKey ||
                    e.originalEvent.metaKey);
                if (!isMulti && selectedIndices.size > 0) {
                  clearSelection();
                }
                return;
              }
            }
          }
        }

        if (selectMode === "click") {
          if (dist <= 6) {
            if (Date.now() - lastFeatureClickTime < 120) {
              return;
            }

            if (activeLayerId && vectorLayers[activeLayerId]) {
              var hit = findFeatureAtPoint(
                e.containerPoint,
                e.latlng,
                activeLayerId,
              );
              if (hit) {
                handleFeatureClick(
                  hit.idx,
                  activeLayerId,
                  hit.feature,
                  hit.layer,
                  e,
                );
              } else {
                var isMulti =
                  e.originalEvent &&
                  (e.originalEvent.ctrlKey ||
                    e.originalEvent.shiftKey ||
                    e.originalEvent.metaKey);
                if (!isMulti && selectedIndices.size > 0) {
                  clearSelection();
                }
              }
            }
          }
        }
      });

      map.on("click", function (e) {
        closeAllFlyouts();

        if (measureActive) {
          measurePoints.push(e.latlng);
          var m = L.circleMarker(e.latlng, {
            radius: 4,
            color: "#e74c3c",
            fillColor: "#fff",
            fillOpacity: 1,
          }).addTo(map);
          measureMarkers.push(m);

          if (measurePoints.length > 1) {
            if (measureLine) map.removeLayer(measureLine);
            measureLine = L.polyline(measurePoints, {
              color: "#e74c3c",
              weight: 2.5,
              dashArray: "5, 5",
            }).addTo(map);

            var totalDist = 0;
            for (var i = 1; i < measurePoints.length; i++) {
              totalDist += measurePoints[i - 1].distanceTo(measurePoints[i]);
            }
            var distText =
              totalDist > 1000
                ? (totalDist / 1000).toFixed(2) + " km"
                : totalDist.toFixed(1) + " m";

            if (measurePoints.length >= 3) {
              if (measurePolygon) map.removeLayer(measurePolygon);
              measurePolygon = L.polygon(measurePoints, {
                color: "#e74c3c",
                fillOpacity: 0.15,
                weight: 1,
              }).addTo(map);
            }

            if (!measureTooltip) {
              measureTooltip = L.tooltip({
                permanent: true,
                className: "measure-tooltip",
              });
            }
            measureTooltip
              .setLatLng(e.latlng)
              .setContent("📏 " + distText)
              .addTo(map);
          }
          return;
        }

        if (drawMode === "point") {
          var feat = {
            type: "Feature",
            geometry: {
              type: "Point",
              coordinates: [e.latlng.lng, e.latlng.lat],
            },
            properties: {},
          };
          cancelDrawMode();
          if (pyBridge && pyBridge.onFeatureAdded) {
            pyBridge.onFeatureAdded(JSON.stringify(feat));
          }
          return;
        }

        if (drawMode === "line") {
          polyDrawPoints.push(e.latlng);
          var lm = L.circleMarker(e.latlng, {
            radius: 4.5,
            color: "#ff8800",
            fillColor: "#ffffff",
            fillOpacity: 1,
            weight: 2,
          }).addTo(map);
          polyDrawMarkers.push(lm);

          if (polyDrawPoints.length > 1) {
            if (polyDrawLine) map.removeLayer(polyDrawLine);
            polyDrawLine = L.polyline(polyDrawPoints, {
              color: "#ff8800",
              weight: 3,
            }).addTo(map);
          }
          return;
        }

        if (drawMode === "polygon") {
          polyDrawPoints.push(e.latlng);
          var pm = L.circleMarker(e.latlng, {
            radius: 5,
            color: "#0078d4",
            fillColor: "#ffffff",
            fillOpacity: 1,
            weight: 2,
          }).addTo(map);
          polyDrawMarkers.push(pm);

          if (polyDrawPoints.length > 1) {
            if (polyDrawLine) map.removeLayer(polyDrawLine);
            polyDrawLine = L.polyline(polyDrawPoints, {
              color: "#0078d4",
              weight: 2.5,
              dashArray: "4, 4",
            }).addTo(map);
          }
          if (polyDrawPoints.length >= 3) {
            if (polyDrawPoly) map.removeLayer(polyDrawPoly);
            polyDrawPoly = L.polygon(polyDrawPoints, {
              color: "#0078d4",
              weight: 1,
              fillOpacity: 0.2,
            }).addTo(map);
          }
          return;
        }

        if (Date.now() - lastFeatureClickTime < 400) {
          return;
        }

        var layerWasClicked = e.originalEvent && e.originalEvent._layerClicked;
        if (!layerWasClicked && (selectMode === "click" || selectMode === "box")) {
          if (activeLayerId && vectorLayers[activeLayerId]) {
            var hit = findFeatureAtPoint(
              e.containerPoint,
              e.latlng,
              activeLayerId,
            );
            if (hit) {
              handleFeatureClick(
                hit.idx,
                activeLayerId,
                hit.feature,
                hit.layer,
                e,
              );
              return;
            }
          }
          var isMulti =
            e.originalEvent &&
            (e.originalEvent.ctrlKey ||
              e.originalEvent.shiftKey ||
              e.originalEvent.metaKey);
          if (!isMulti && selectedIndices.size > 0) {
            clearSelection();
          }
        }
      });

      map.on("dblclick", function (e) {
        if (drawMode === "line") {
          if (polyDrawPoints.length >= 2) {
            var lineCoords = polyDrawPoints.map(function (p) {
              return [p.lng, p.lat];
            });
            var lineFeat = {
              type: "Feature",
              geometry: {
                type: "LineString",
                coordinates: lineCoords,
              },
              properties: {},
            };
            cancelDrawMode();
            if (pyBridge && pyBridge.onFeatureAdded) {
              pyBridge.onFeatureAdded(JSON.stringify(lineFeat));
            }
          } else {
            cancelDrawMode();
          }
          return;
        }
        if (drawMode === "polygon") {
          if (polyDrawPoints.length >= 3) {
            var coords = polyDrawPoints.map(function (p) {
              return [p.lng, p.lat];
            });
            coords.push([coords[0][0], coords[0][1]]);
            var feat = {
              type: "Feature",
              geometry: {
                type: "Polygon",
                coordinates: [coords],
              },
              properties: {},
            };
            cancelDrawMode();
            if (pyBridge && pyBridge.onFeatureAdded) {
              pyBridge.onFeatureAdded(JSON.stringify(feat));
            }
          } else {
            cancelDrawMode();
          }
          return;
        }
      });

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          if (vertexEditActive) finishVertexEditMode();
          if (isBoxSelecting && boxRectLayer) {
            map.removeLayer(boxRectLayer);
            boxRectLayer = null;
            isBoxSelecting = false;
          }
          if (selectMode === "box") setSelectTool("click");
          if (drawMode) cancelDrawMode();
          if (measureActive) toggleMeasure();
          closeAllFlyouts();
        } else if (e.key === "Delete" || e.key === "Backspace") {
          if (selectedIndices.size > 0 && !drawMode && !measureActive) {
            deleteSelectedFeatures();
          }
        }
      });

      function handleFeatureClick(currentIdx, layerId, feature, layer, e) {
        if (drawMode || measureActive) return;

        if (
          Date.now() - lastFeatureClickTime < 100 &&
          lastClickedFeatureIdx === currentIdx &&
          selectedFeatureLayerId === layerId
        ) {
          return;
        }
        lastFeatureClickTime = Date.now();
        lastClickedFeatureIdx = currentIdx;

        if (e && e.originalEvent) {
          e.originalEvent._layerClicked = true;
        }

        if (vertexEditActive) {
          selectedIndices.clear();
          selectedIndices.add(currentIdx);
          selectedFeatureIndex = currentIdx;
          selectedFeatureLayerId = layerId;
          refreshLayerStyles(layerId);
          notifySelectionChanged();
          attachVertexHandles(layerId, currentIdx);
          return;
        }

        var isMulti =
          e &&
          e.originalEvent &&
          (e.originalEvent.ctrlKey ||
            e.originalEvent.shiftKey ||
            e.originalEvent.metaKey);

        var prevLayerId = selectedFeatureLayerId;
        if (isMulti) {
          if (selectedIndices.has(currentIdx)) {
            selectedIndices.delete(currentIdx);
          } else {
            selectedIndices.add(currentIdx);
          }
        } else {
          selectedIndices.clear();
          selectedIndices.add(currentIdx);
        }

        selectedFeatureIndex = selectedIndices.size === 1 ? currentIdx : -1;
        selectedFeatureLayerId = layerId;

        if (prevLayerId && prevLayerId !== layerId) {
          refreshLayerStyles(prevLayerId);
        }
        refreshLayerStyles(layerId);
        notifySelectionChanged();

        if (layerId !== activeLayerId) {
          requestSetActiveLayer(layerId, true);
        }

        if (pyBridge && selectedIndices.size === 1) {
          pyBridge.onFeatureClicked(currentIdx);
        }
      }

      var lastGeojsonData = null;
      var hasFittedInitially = false;

      function isSafeLatLng(ll) {
        if (!ll) return false;
        var lat =
          typeof ll.lat === "number"
            ? ll.lat
            : Array.isArray(ll)
              ? ll[0]
              : null;
        var lng =
          typeof ll.lng === "number"
            ? ll.lng
            : Array.isArray(ll)
              ? ll[1]
              : null;
        if (lat === null || lng === null) return false;
        if (!isFinite(lat) || !isFinite(lng)) return false;
        if (Math.abs(lat) > 85.06) return false;
        if (Math.abs(lng) > 360) return false;
        return true;
      }

      function isSafeBounds(b) {
        if (!b || typeof b.isValid !== "function" || !b.isValid()) return false;
        var sw = b.getSouthWest();
        var ne = b.getNorthEast();
        if (!sw || !ne) return false;
        if (!isSafeLatLng(sw) || !isSafeLatLng(ne)) return false;
        return true;
      }

      function createLeafletLayer(layerId, name, geojsonData, color) {
        var featureIdx = 0;
        var indexMap = {};

        try {
          var lLayer = L.geoJSON(geojsonData, {
            renderer: sharedCanvas,
            smoothFactor: 1.0,
            filter: function (feature) {
              if (!feature || !feature.geometry) return false;
              var g = feature.geometry;
              if (!g.coordinates) return false;
              if (g.type === "Point") {
                return isSafeLatLng({
                  lat: g.coordinates[1],
                  lng: g.coordinates[0],
                });
              }
              return true;
            },
            pointToLayer: function (feature, latlng) {
              if (!isSafeLatLng(latlng)) {
                return L.circleMarker([0, 0], {
                  opacity: 0,
                  fillOpacity: 0,
                  radius: 0,
                });
              }
              return L.circleMarker(latlng, {
                renderer: sharedCanvas,
                radius: 6,
                fillColor: color,
                color: "#ffffff",
                weight: 1.5,
                opacity: currentOpacity,
                fillOpacity: currentOpacity * 0.9,
              });
            },
            style: function (feature) {
              var gtype =
                (feature.geometry && feature.geometry.type) || "Polygon";
              var isLine = gtype.indexOf("Line") !== -1;
              return {
                renderer: sharedCanvas,
                color: color,
                weight: isLine ? 2.5 : 2,
                opacity: currentOpacity,
                fillColor: color,
                fillOpacity: isLine ? 0 : currentOpacity * 0.35,
              };
            },
            onEachFeature: function (feature, layer) {
              var currentIdx =
                feature &&
                feature.id !== undefined &&
                !isNaN(parseInt(feature.id, 10))
                  ? parseInt(feature.id, 10)
                  : featureIdx++;
              indexMap[currentIdx] = layer;
              layer._featureIdx = currentIdx;
              layer._layerId = layerId;
              layer.feature = feature;

              if (layer.eachLayer) {
                layer.eachLayer(function (child) {
                  child._featureIdx = currentIdx;
                  child._layerId = layerId;
                  child.feature = feature;
                  child.on("click", function (e) {
                    if (e && e.originalEvent) {
                      e.originalEvent._layerClicked = true;
                    }
                    handleFeatureClick(currentIdx, layerId, feature, child, e);
                  });
                });
              }

              layer.on("click", function (e) {
                if (e && e.originalEvent) {
                  e.originalEvent._layerClicked = true;
                }
                handleFeatureClick(currentIdx, layerId, feature, layer, e);
              });
            },
          });

          return { leafletLayer: lLayer, indexMap: indexMap };
        } catch (e) {
          console.error("Leaflet layer creation failed:", e);
          return { leafletLayer: L.featureGroup(), indexMap: {} };
        }
      }

      function setVectorLayer(
        layerId,
        name,
        geojsonData,
        isActive,
        geomType,
        color,
        fitBounds,
        isWfs,
      ) {
        if (!layerId) layerId = "default";
        name = name || "Spatial Layer";
        var isWfsLayer =
          !!isWfs ||
          (name &&
            (name.indexOf("(WFS)") !== -1 ||
              name.indexOf("[WFS]") !== -1 ||
              name.indexOf("WFS") !== -1));

        var prevVisible = true;
        var assignedColor = color;
        if (vectorLayers[layerId]) {
          prevVisible = vectorLayers[layerId].visible;
          if (!assignedColor) assignedColor = vectorLayers[layerId].color;
          if (vectorLayers[layerId].leafletLayer) {
            try {
              map.removeLayer(vectorLayers[layerId].leafletLayer);
            } catch (e) {}
          }
        } else {
          if (!assignedColor) {
            var cnt = Object.keys(vectorLayers).length;
            assignedColor = LAYER_PALETTE[cnt % LAYER_PALETTE.length];
          }
        }

        var featureCount = 0;
        if (
          geojsonData &&
          geojsonData.type === "FeatureCollection" &&
          geojsonData.features
        ) {
          featureCount = geojsonData.features.length;
        } else if (geojsonData && geojsonData.type === "Feature") {
          featureCount = 1;
        }

        var detectedGeom = geomType;
        if (!detectedGeom || detectedGeom === "any") {
          if (
            geojsonData &&
            geojsonData.features &&
            geojsonData.features.length > 0
          ) {
            var dt = {};
            for (
              var di = 0;
              di < Math.min(geojsonData.features.length, 100);
              di++
            ) {
              var fg = geojsonData.features[di].geometry;
              if (fg && fg.type) {
                var lt = fg.type.toLowerCase();
                if (lt.indexOf("point") !== -1) dt["point"] = true;
                else if (lt.indexOf("line") !== -1) dt["line"] = true;
                else if (lt.indexOf("poly") !== -1) dt["polygon"] = true;
              }
            }
            var dkeys = Object.keys(dt);
            detectedGeom =
              dkeys.length === 1
                ? dkeys[0]
                : dkeys.length > 1
                  ? "mixed"
                  : "any";
          } else {
            detectedGeom = "any";
          }
        }

        var res;
        try {
          res = createLeafletLayer(layerId, name, geojsonData, assignedColor);
        } catch (e) {
          console.error("setVectorLayer createLeafletLayer failed:", e);
          res = { leafletLayer: L.featureGroup(), indexMap: {} };
        }
        var lGeojson = res.leafletLayer;
        var lIndexMap = res.indexMap;

        if (prevVisible && lGeojson) {
          try {
            map.addLayer(lGeojson);
          } catch (e) {
            console.error("map.addLayer error:", e);
          }
        }

        vectorLayers[layerId] = {
          id: layerId,
          name: name,
          count: featureCount,
          geomType: detectedGeom,
          color: assignedColor,
          visible: prevVisible,
          isActive: !!isActive,
          leafletLayer: lGeojson,
          geojsonData: geojsonData,
          indexMap: lIndexMap,
          isWfs: isWfsLayer,
        };

        if (isActive) {
          setActiveVectorLayer(layerId, detectedGeom);
        } else {
          renderLayersPanel();
        }

        var lFlyout = document.getElementById("layersFlyout");
        var btnL = document.getElementById("btnLayers");
        if (lFlyout && !lFlyout.classList.contains("open")) {
          lFlyout.classList.add("open");
          if (btnL) btnL.classList.add("active");
        }

        if (fitBounds === true) {
          fitLayerBounds(layerId);
        }
      }

      function updateVectorLayerData(layerId, name, geojsonData, geomType) {
        if (!layerId || !vectorLayers[layerId]) return;
        var layerObj = vectorLayers[layerId];
        if (layerObj.leafletLayer) {
          try {
            map.removeLayer(layerObj.leafletLayer);
          } catch (e) {}
        }
        var res;
        try {
          res = createLeafletLayer(
            layerId,
            name || layerObj.name,
            geojsonData,
            layerObj.color,
          );
        } catch (e) {
          console.error("updateVectorLayerData error:", e);
          res = { leafletLayer: L.featureGroup(), indexMap: {} };
        }
        layerObj.leafletLayer = res.leafletLayer;
        layerObj.indexMap = res.indexMap;
        layerObj.geojsonData = geojsonData;
        if (geomType && geomType !== "any") {
          layerObj.geomType = geomType;
        }
        if (layerObj.visible && layerObj.leafletLayer) {
          try {
            map.addLayer(layerObj.leafletLayer);
            if (layerObj.isActive) {
              layerObj.leafletLayer.bringToFront();
            }
          } catch (e) {}
        }
        refreshLayerStyles(layerId);
      }

      function setActiveVectorLayer(layerId, geomType, preserveSelection) {
        activeLayerId = layerId;
        Object.keys(vectorLayers).forEach(function (k) {
          vectorLayers[k].isActive = k === layerId;
        });

        var activeObj = vectorLayers[layerId];
        if (activeObj) {
          setLayerGeometryType(geomType || activeObj.geomType);
          if (activeObj.leafletLayer && activeObj.visible) {
            activeObj.leafletLayer.bringToFront();
          }
        } else {
          setLayerGeometryType("any");
        }

        if (!preserveSelection) {
          selectedFeatureIndex = -1;
          selectedIndices.clear();
        }
        updateSelectionUI();
        renderLayersPanel();
      }

      function setVectorLayerVisibility(layerId, visible) {
        if (vectorLayers[layerId]) {
          vectorLayers[layerId].visible = visible;
          if (vectorLayers[layerId].leafletLayer) {
            if (visible) {
              map.addLayer(vectorLayers[layerId].leafletLayer);
              vectorLayers[layerId].leafletLayer.bringToFront();
            } else {
              map.removeLayer(vectorLayers[layerId].leafletLayer);
            }
          }
        }
        renderLayersPanel();
      }

      function removeVectorLayer(layerId) {
        if (vectorLayers[layerId]) {
          if (vectorLayers[layerId].leafletLayer) {
            map.removeLayer(vectorLayers[layerId].leafletLayer);
          }
          delete vectorLayers[layerId];
        }
        if (activeLayerId === layerId) {
          var remaining = Object.keys(vectorLayers);
          if (remaining.length > 0) {
            setActiveVectorLayer(remaining[0]);
          } else {
            activeLayerId = null;
            setLayerGeometryType("any");
          }
        }
        renderLayersPanel();
      }

      function clearAllVectorLayers() {
        Object.keys(vectorLayers).forEach(function (k) {
          if (vectorLayers[k].leafletLayer) {
            map.removeLayer(vectorLayers[k].leafletLayer);
          }
        });
        vectorLayers = {};
        activeLayerId = null;
        setLayerGeometryType("any");
        renderLayersPanel();
      }

      function updateLayerName(layerId, name) {
        if (vectorLayers[layerId]) {
          vectorLayers[layerId].name = name;
          renderLayersPanel();
        }
      }

      function requestSetActiveLayer(layerId, preserveSelection) {
        setActiveVectorLayer(layerId, null, preserveSelection);
        if (pyBridge && pyBridge.onActiveLayerRequested) {
          pyBridge.onActiveLayerRequested(layerId);
        }
      }

      function removeVectorLayerUi(layerId) {
        removeVectorLayer(layerId);
        if (pyBridge && pyBridge.onLayerRemoved) {
          pyBridge.onLayerRemoved(layerId);
        }
      }

      function updateMap(geojsonData, shouldFit) {
        if (!geojsonData) {
          if (activeLayerId) {
            removeVectorLayer(activeLayerId);
          } else {
            clearAllVectorLayers();
          }
          return;
        }
        var currentId = activeLayerId || "default";
        var currentName =
          (vectorLayers[currentId] && vectorLayers[currentId].name) ||
          "Spatial Layer";
        setVectorLayer(
          currentId,
          currentName,
          geojsonData,
          true,
          activeLayerGeomType,
          null,
          shouldFit,
        );
      }

      function fitLayerBounds(layerId) {
        var doFit = function () {
          if (map.invalidateSize) map.invalidateSize();
          var targetLayer =
            layerId && vectorLayers[layerId]
              ? vectorLayers[layerId]
              : activeLayerId && vectorLayers[activeLayerId]
                ? vectorLayers[activeLayerId]
                : null;
          if (
            targetLayer &&
            targetLayer.leafletLayer &&
            targetLayer.leafletLayer.getBounds
          ) {
            var b = targetLayer.leafletLayer.getBounds();
            if (isSafeBounds(b)) {
              try {
                map.fitBounds(b, { padding: [40, 40], maxZoom: 16 });
              } catch (e) {}
              return;
            }
          }
          var allBounds = L.latLngBounds();
          var hasValid = false;
          Object.keys(vectorLayers).forEach(function (k) {
            var l = vectorLayers[k];
            if (l.visible && l.leafletLayer && l.leafletLayer.getBounds) {
              var lb = l.leafletLayer.getBounds();
              if (isSafeBounds(lb)) {
                allBounds.extend(lb);
                hasValid = true;
              }
            }
          });
          if (hasValid && isSafeBounds(allBounds)) {
            try {
              map.fitBounds(allBounds, { padding: [40, 40], maxZoom: 16 });
            } catch (e) {}
          }
        };
        doFit();
        setTimeout(doFit, 80);
        setTimeout(doFit, 250);
      }

      function zoomFullExtent() {
        if (map.invalidateSize) map.invalidateSize();
        var allBounds = L.latLngBounds();
        var hasValid = false;
        Object.keys(vectorLayers).forEach(function (k) {
          var l = vectorLayers[k];
          if (l.visible && l.leafletLayer && l.leafletLayer.getBounds) {
            var lb = l.leafletLayer.getBounds();
            if (isSafeBounds(lb)) {
              allBounds.extend(lb);
              hasValid = true;
            }
          }
        });
        if (hasValid && isSafeBounds(allBounds)) {
          try {
            map.fitBounds(allBounds, { padding: [40, 40], maxZoom: 16 });
          } catch (e) {}
        } else {
          try {
            map.setView([39.0, 35.0], 6);
          } catch (e) {}
        }
      }

      function refreshMap() {
        if (map) {
          map.invalidateSize();
          Object.keys(vectorLayers).forEach(function (k) {
            refreshLayerStyles(k);
          });
          bringVectorsToFront();
        }
      }

      function renderSnapshotLegend() {
        var legendEl = document.getElementById("snapshotLegend");
        if (!legendEl) return;

        var vKeys = Object.keys(vectorLayers).filter(function (k) {
          return vectorLayers[k].visible;
        });
        var wKeys = Object.keys(wmsRegistry).filter(function (k) {
          return wmsRegistry[k].visible;
        });

        if (vKeys.length === 0 && wKeys.length === 0) {
          legendEl.style.display = "none";
          return;
        }

        var html = '<div class="snapshot-legend-title">🗂️ Layers</div>';
        html += '<div class="snapshot-legend-items">';

        vKeys.forEach(function (k) {
          var l = vectorLayers[k];
          var sym = getLayerSymbolHtml(l.geomType, l.color);
          var cnt =
            l.count > 0
              ? ' <span style="opacity:0.6; font-size:10px;">(' +
                l.count.toLocaleString() +
                ")</span>"
              : "";
          html +=
            '<div class="snapshot-legend-item">' +
            sym +
            '<span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' +
            l.name +
            cnt +
            "</span></div>";
        });

        wKeys.forEach(function (k) {
          var w = wmsRegistry[k];
          var sym = getWmsSymbolHtml();
          var title = w.title || w.layerName;
          html +=
            '<div class="snapshot-legend-item">' +
            sym +
            '<span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' +
            title +
            "</span></div>";
        });

        html += "</div>";
        legendEl.innerHTML = html;
        legendEl.style.display = "block";
      }

      function prepareSnapshotMode() {
        closeAllFlyouts();
        renderSnapshotLegend();
        if (typeof updateCoordinatesToMapCenter === "function") {
          updateCoordinatesToMapCenter();
        }
        document.body.classList.add("snapshot-mode");
        return true;
      }

      function restoreSnapshotMode() {
        document.body.classList.remove("snapshot-mode");
        return true;
      }

      function captureMapSnapshot() {
        if (pyBridge && pyBridge.requestCaptureSnapshot) {
          pyBridge.requestCaptureSnapshot();
        }
      }

      function highlightFeature(idx, layerId) {
        var lId = layerId || activeLayerId;
        if (!lId || !vectorLayers[lId]) return;
        var layerObj = vectorLayers[lId];
        selectedIndices.clear();
        selectedIndices.add(idx);
        selectedFeatureIndex = idx;
        selectedFeatureLayerId = lId;
        refreshLayerStyles(lId);
        updateSelectionUI();
        var l = layerObj.indexMap[idx];
        if (l) {
          if (l.getBounds && isSafeBounds(l.getBounds())) {
            try {
              map.fitBounds(l.getBounds(), { maxZoom: 16, padding: [40, 40] });
            } catch (e) {}
          } else if (l.getLatLng && isSafeLatLng(l.getLatLng())) {
            try {
              map.setView(l.getLatLng(), Math.max(map.getZoom(), 13));
            } catch (e) {}
          }
          if (l.openPopup) {
            try {
              l.openPopup();
            } catch (e) {}
          }
        }
      }

      var topologyHighlightGroup = L.featureGroup().addTo(map);

      function showTopologyErrorFocus(
        geojsonGeom,
        boundsObj,
        title,
        desc,
        parentIndices,
        parentLayerId,
      ) {
        if (!map) return;
        topologyHighlightGroup.clearLayers();

        if (
          Array.isArray(parentIndices) &&
          parentIndices.length > 0 &&
          parentLayerId &&
          vectorLayers[parentLayerId]
        ) {
          setSelectedFeatures(parentIndices, parentLayerId);
        }

        if (geojsonGeom) {
          try {
            var featureObj =
              geojsonGeom && geojsonGeom.type === "Feature"
                ? geojsonGeom
                : { type: "Feature", geometry: geojsonGeom, properties: {} };

            var errLayer = L.geoJSON(featureObj, {
              pointToLayer: function (feature, latlng) {
                var outerRing = L.circleMarker(latlng, {
                  interactive: false,
                  radius: 16,
                  color: "#ff0033",
                  weight: 2.5,
                  dashArray: "3, 3",
                  fillColor: "#ff0033",
                  fillOpacity: 0.22,
                });
                var innerBullseye = L.circleMarker(latlng, {
                  interactive: false,
                  radius: 7,
                  color: "#ffffff",
                  weight: 2,
                  fillColor: "#ff0033",
                  fillOpacity: 1.0,
                });
                return L.featureGroup([outerRing, innerBullseye]);
              },
              style: function (feature) {
                var gtype =
                  (feature && feature.geometry && feature.geometry.type) ||
                  "Polygon";
                var isLine = gtype.indexOf("Line") !== -1;
                return {
                  interactive: false,
                  color: "#ff0033",
                  weight: isLine ? 5.0 : 3.0,
                  opacity: 1.0,
                  dashArray: isLine ? "6, 6" : "4, 4",
                  fillColor: "#ff0033",
                  fillOpacity: isLine ? 0 : 0.65,
                };
              },
            });

            topologyHighlightGroup.addLayer(errLayer);
            topologyHighlightGroup.bringToFront();
          } catch (e) {
            console.error("showTopologyErrorFocus render error:", e);
          }
        }

        var centerLatLng = null;
        if (
          boundsObj &&
          typeof boundsObj.south === "number" &&
          typeof boundsObj.west === "number"
        ) {
          var sw = L.latLng(boundsObj.south, boundsObj.west);
          var ne = L.latLng(boundsObj.north, boundsObj.east);
          var b = L.latLngBounds(sw, ne);
          if (isSafeBounds(b)) {
            centerLatLng = b.getCenter();
            try {
              map.fitBounds(b, {
                maxZoom: boundsObj.maxZoom || 18,
                padding: [60, 60],
                animate: true,
              });
            } catch (e) {
              console.error("showTopologyErrorFocus fitBounds error:", e);
            }
          }
        }

        if ((title || desc) && centerLatLng && isSafeLatLng(centerLatLng)) {
          setTimeout(function () {
            try {
              var popupContent =
                '<div style="font-family:sans-serif; min-width:180px; max-width:280px;">' +
                '<div style="font-size:12px; font-weight:bold; color:#d63031; border-bottom:1px solid #fab1a0; padding-bottom:3px; margin-bottom:4px;">' +
                "⚠️ " +
                (title || "Topoloji Hatası") +
                "</div>" +
                '<div style="font-size:11px; color:#2d3436; line-height:1.4;">' +
                (desc || "") +
                "</div>" +
                "</div>";
              L.popup({ autoPan: false, closeButton: true, offset: [0, -10] })
                .setLatLng(centerLatLng)
                .setContent(popupContent)
                .openOn(map);
            } catch (e) {}
          }, 280);
        }
      }

      function clearTopologyHighlight() {
        if (topologyHighlightGroup) {
          topologyHighlightGroup.clearLayers();
        }
        if (map && map.closePopup) {
          try {
            map.closePopup();
          } catch (e) {}
        }
      }
    </script>
  </body>
</html>
