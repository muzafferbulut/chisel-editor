<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <style>
      html,
      body,
      #map {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .hud-toolbar-v {
        position: absolute;
        top: 14px;
        right: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        background: rgba(24, 28, 34, 0.92);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 8px;
        padding: 6px 5px;
        z-index: 1000;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        user-select: none;
      }
      .hud-vbtn {
        position: relative;
        width: 30px;
        height: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.14);
        color: #e0e0e0;
        border-radius: 5px;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.15s ease;
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      .hud-vbtn:hover {
        background: #0078d4;
        border-color: #4cc2ff;
        color: #ffffff;
      }
      .hud-vbtn.active {
        background: #0078d4;
        border-color: #4cc2ff;
        color: #ffffff;
        font-weight: bold;
      }
      .hud-vbtn.disabled {
        opacity: 0.28 !important;
        cursor: not-allowed !important;
        background: rgba(255, 255, 255, 0.03) !important;
        border-color: rgba(255, 255, 255, 0.08) !important;
      }
      .hud-vbtn.disabled:hover {
        background: rgba(255, 255, 255, 0.05) !important;
        border-color: rgba(231, 76, 60, 0.4) !important;
        color: #888888 !important;
      }
      .hud-vbtn-del:hover {
        background: #d32f2f !important;
        border-color: #f44336 !important;
        color: #ffffff !important;
      }
      .hud-vbtn-del.has-selection {
        background: rgba(231, 76, 60, 0.3);
        border-color: #e74c3c;
        color: #ff6b6b;
      }
      .hud-vdivider {
        width: 20px;
        height: 1px;
        background: rgba(255, 255, 255, 0.15);
        margin: 2px 0;
      }
      .hud-vbtn[data-tip]::after {
        content: attr(data-tip);
        position: absolute;
        right: calc(100% + 9px);
        top: 50%;
        transform: translateY(-50%);
        background: rgba(15, 23, 42, 0.95);
        color: #ffffff;
        font-size: 11px;
        font-weight: 500;
        padding: 4px 8px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        white-space: nowrap;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.15s ease,
          transform 0.15s ease;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        z-index: 2000;
      }
      .hud-vbtn:hover[data-tip]::after {
        opacity: 1;
        visibility: visible;
        transform: translateY(-50%) translateX(-2px);
      }
      .hud-flyout {
        position: absolute;
        right: 38px;
        top: 0;
        display: none;
        background: rgba(24, 28, 34, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 6px;
        padding: 4px;
        gap: 4px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
        z-index: 1002;
        white-space: nowrap;
      }
      .hud-flyout.open {
        display: flex;
      }
      .hud-layers-flyout {
        position: absolute;
        right: 38px;
        top: 0;
        display: none;
        flex-direction: column;
        background: rgba(24, 28, 34, 0.96);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 8px;
        padding: 8px 10px;
        gap: 6px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        z-index: 1002;
        min-width: 220px;
        max-width: 290px;
        color: #e0e0e0;
        user-select: none;
      }
      .hud-layers-flyout.open {
        display: flex;
      }
      .hud-layers-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        font-weight: 700;
        color: #9cdcfe;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 5px;
        letter-spacing: 0.3px;
      }
      .hud-layer-count-badge {
        background: rgba(255, 255, 255, 0.12);
        color: #9cdcfe;
        border-radius: 10px;
        font-size: 10px;
        padding: 0 5px;
        font-weight: 600;
      }
      .hud-layers-add-btn {
        background: rgba(0, 120, 212, 0.25);
        border: 1px solid rgba(76, 194, 255, 0.4);
        color: #4cc2ff;
        font-size: 10px;
        font-weight: 600;
        padding: 2px 7px;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .hud-layers-add-btn:hover {
        background: #0078d4;
        color: #ffffff;
      }
      .hud-layers-list {
        display: flex;
        flex-direction: column;
        gap: 3px;
        max-height: 260px;
        overflow-y: auto;
        padding-right: 2px;
      }
      .hud-layers-list::-webkit-scrollbar {
        width: 4px;
      }
      .hud-layers-list::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
      }
      .hud-layer-item {
        display: flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-left: 3px solid transparent;
        border-radius: 4px;
        padding: 4px 6px;
        font-size: 11px;
        gap: 6px;
        cursor: pointer;
        transition:
          background 0.12s ease,
          border-color 0.12s ease;
      }
      .hud-layer-item:hover {
        background: rgba(255, 255, 255, 0.09);
        border-color: rgba(255, 255, 255, 0.15);
      }
      .hud-layer-item.active-layer {
        background: rgba(0, 120, 212, 0.22) !important;
        border-color: rgba(76, 194, 255, 0.35) !important;
        border-left: 3px solid #0078d4 !important;
      }
      .hud-layer-symbology {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        flex-shrink: 0;
      }
      .hud-layer-btn-del {
        background: transparent;
        border: none;
        color: #888888;
        cursor: pointer;
        padding: 2px 4px;
        font-size: 11px;
        border-radius: 3px;
        opacity: 0.5;
        transition: all 0.15s ease;
        flex-shrink: 0;
      }
      .hud-layer-item:hover .hud-layer-btn-del {
        opacity: 1;
      }
      .hud-layer-btn-del:hover {
        color: #ff5252;
        background: rgba(231, 76, 60, 0.2);
      }
      .hud-layer-tag {
        font-size: 9px;
        font-weight: 700;
        padding: 1px 4px;
        border-radius: 3px;
        letter-spacing: 0.3px;
        flex-shrink: 0;
        line-height: 1.2;
      }
      .hud-layer-tag.wfs-tag {
        background: rgba(46, 204, 113, 0.2);
        color: #2ecc71;
        border: 1px solid rgba(46, 204, 113, 0.4);
      }
      .hud-layer-tag.wms-tag {
        background: rgba(56, 189, 248, 0.2);
        color: #38bdf8;
        border: 1px solid rgba(56, 189, 248, 0.4);
      }
      .hud-layers-section-header {
        font-size: 10px;
        font-weight: 700;
        color: #858585;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 5px 2px 2px 2px;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .hud-flyout-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: #e0e0e0;
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 11px;
        transition: all 0.15s ease;
      }
      .hud-flyout-btn:hover {
        background: #0078d4;
        border-color: #0078d4;
        color: #fff;
      }
      .hud-flyout-btn.active {
        background: #0078d4;
        border-color: #0078d4;
        color: #fff;
        font-weight: bold;
      }
      .measure-tooltip {
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        padding: 3px 6px;
        border-radius: 3px;
        font-size: 11px;
        font-weight: bold;
        border: 1px solid #00a2ff;
      }
      .leaflet-bottom.leaflet-left {
        display: flex !important;
        flex-direction: row !important;
        align-items: flex-end !important;
        gap: 6px !important;
        margin-left: 10px !important;
        margin-bottom: 8px !important;
        pointer-events: none;
      }
      .leaflet-bottom.leaflet-left .leaflet-control {
        margin: 0 !important;
        pointer-events: auto;
      }
      .leaflet-control-scale-line {
        background: rgba(24, 28, 34, 0.75) !important;
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.28) !important;
        border-top: none !important;
        color: #d1d5db !important;
        font-family:
          Consolas,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif !important;
        font-size: 11px !important;
        font-weight: 500 !important;
        padding: 2px 6px 1px 6px !important;
        box-sizing: border-box;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
        text-shadow: none !important;
        height: 20px;
        display: flex;
        align-items: center;
        border-radius: 0 0 2px 2px;
      }
      .hud-coords-control {
        background: rgba(24, 28, 34, 0.75);
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 2px;
        padding: 2px 8px 1px 8px;
        font-size: 11px;
        font-family:
          Consolas,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          monospace;
        font-weight: 500;
        color: #d1d5db;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
        height: 20px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        cursor: pointer;
        user-select: none;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease;
        white-space: nowrap;
      }
      .hud-coords-control:hover {
        background: rgba(0, 120, 212, 0.85);
        border-color: #38bdf8;
        color: #ffffff;
      }
      .hud-coords-control.copied {
        background: rgba(46, 204, 113, 0.9) !important;
        border-color: #2ecc71 !important;
        color: #ffffff !important;
      }
      .vertex-handle-icon {
        background: transparent;
        border: none;
      }
      .vertex-handle-inner {
        width: 11px;
        height: 11px;
        background: #ffffff;
        border: 2px solid #0078d4;
        border-radius: 50%;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.6);
        cursor: grab;
        transition: transform 0.12s ease;
        box-sizing: border-box;
      }
      .vertex-handle-inner:hover {
        transform: scale(1.35);
        background: #ffb703;
        border-color: #fb8500;
      }
      .vertex-handle-inner:active {
        cursor: grabbing;
      }
      .snapshot-legend {
        display: none;
        position: absolute;
        top: 14px;
        right: 14px;
        background: rgba(24, 28, 34, 0.9);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        padding: 8px 12px;
        color: #f1f5f9;
        font-size: 11px;
        z-index: 1000;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
        min-width: 140px;
        max-width: 280px;
        pointer-events: none;
      }
      .snapshot-legend-title {
        font-size: 11px;
        font-weight: 700;
        color: #9cdcfe;
        margin-bottom: 6px;
        padding-bottom: 4px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        letter-spacing: 0.3px;
      }
      .snapshot-legend-items {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .snapshot-legend-item {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        line-height: 1.3;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      body.snapshot-mode .snapshot-legend {
        display: block !important;
      }
      body.snapshot-mode .hud-toolbar-v {
        display: none !important;
      }
      body.snapshot-mode .leaflet-control-zoom {
        display: none !important;
      }
      body.snapshot-mode .vertex-handle-icon {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <div id="snapshotLegend" class="snapshot-legend"></div>

    <div class="hud-toolbar-v">
      <div style="position: relative">
        <button
          class="hud-vbtn"
          id="btnLayers"
          onclick="toggleLayersFlyout()"
          data-tip="Layers"
          title="Layers"
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"
            />
            <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" />
            <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" />
          </svg>
        </button>
        <div class="hud-layers-flyout" id="layersFlyout">
          <div class="hud-layers-header">
            <span style="display: flex; align-items: center; gap: 6px">
              <svg
                width="13"
                height="13"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"
                />
                <path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65" />
                <path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65" />
              </svg>
              <span>Layers</span>
            </span>
            <button
              class="hud-layers-add-btn"
              onclick="requestAddService()"
              title="Add WMS / WFS Service & Basemaps"
            >
              + WMS & WFS
            </button>
          </div>
          <div class="hud-layers-list" id="layersListContainer">
            <div
              style="
                color: #858585;
                font-size: 11px;
                padding: 6px 2px;
                text-align: center;
              "
            >
              (No layers)
            </div>
          </div>
        </div>
      </div>

      <div class="hud-vdivider"></div>

      <button
        class="hud-vbtn"
        id="btnTable"
        onclick="toggleTableHud()"
        data-tip="Attribute Table"
        title="Attribute Table"
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 3v18" />
          <rect width="18" height="18" x="3" y="3" rx="2" />
          <path d="M3 9h18" />
          <path d="M3 15h18" />
        </svg>
      </button>
      <button
        class="hud-vbtn"
        id="btnFit"
        onclick="fitLayerBounds()"
        data-tip="Zoom to Layer"
        title="Zoom to Layer"
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10" />
          <line x1="22" x2="18" y1="12" y2="12" />
          <line x1="6" x2="2" y1="12" y2="12" />
          <line x1="12" x2="12" y1="6" y2="2" />
          <line x1="12" x2="12" y1="22" y2="18" />
        </svg>
      </button>

      <div class="hud-vdivider"></div>

      <button
        class="hud-vbtn active"
        id="btnSelectClick"
        onclick="setSelectTool('click')"
        data-tip="Single Selection"
        title="Single Select"
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="m3 3 7.07 16.97 2.51-7.39 7.39-2.51L3 3z" />
          <path d="m13 13 6 6" />
        </svg>
      </button>
      <button
        class="hud-vbtn"
        id="btnSelectBox"
        onclick="setSelectTool('box')"
        data-tip="Multi Selection"
        title="Box Select"
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M5 3a2 2 0 0 0-2 2" />
          <path d="M19 3a2 2 0 0 1 2 2" />
          <path d="M21 19a2 2 0 0 1-2 2" />
          <path d="M5 21a2 2 0 0 1-2-2" />
          <path d="M9 3h1" />
          <path d="M9 21h1" />
          <path d="M14 3h1" />
          <path d="M14 21h1" />
          <path d="M3 9v1" />
          <path d="M21 9v1" />
          <path d="M3 14v1" />
          <path d="M21 14v1" />
        </svg>
      </button>
      <button
        class="hud-vbtn disabled"
        id="btnZoomSel"
        onclick="zoomToSelected()"
        data-tip="Zoom to Selected"
        title="Zoom to Selected"
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="8" />
          <line x1="21" x2="16.65" y1="21" y2="16.65" />
          <line x1="11" x2="11" y1="8" y2="14" />
          <line x1="8" x2="14" y1="11" y2="11" />
        </svg>
      </button>
      <button
        class="hud-vbtn disabled"
        id="btnClearSel"
        onclick="clearSelection()"
        data-tip="Clear Selection"
        title="Clear Selection"
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect width="18" height="18" x="3" y="3" rx="2" />
          <path d="m15 9-6 6" />
          <path d="m9 9 6 6" />
        </svg>
      </button>

      <div class="hud-vdivider"></div>

      <button
        class="hud-vbtn"
        id="btnAddPoint"
        onclick="toggleDrawMode('point')"
        data-tip="Add Point (Click Map)"
        title="Add Point"
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M19.914 11.105A7.298 7.298 0 0 0 20 10a8 8 0 0 0-16 0c0 4.993 5.539 10.193 7.399 11.799a1 1 0 0 0 1.202 0 32.4 32.4 0 0 0 .824-.738"
          />
          <circle cx="12" cy="10" r="3" />
          <line x1="19" x2="19" y1="16" y2="22" />
          <line x1="16" x2="22" y1="19" y2="19" />
        </svg>
      </button>
      <button
        class="hud-vbtn"
        id="btnAddLine"
        onclick="toggleDrawMode('line')"
        data-tip="Add Line"
        title="Add Line"
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="19" cy="5" r="2" />
          <circle cx="5" cy="19" r="2" />
          <path d="M5 17A12 12 0 0 1 17 5" />
        </svg>
      </button>
      <button
        class="hud-vbtn"
        id="btnAddPolygon"
        onclick="toggleDrawMode('polygon')"
        data-tip="Add Polygon (Draw & Double Click)"
        title="Add Polygon"
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M10.83 2.38a2 2 0 0 1 2.34 0l8 5.74a2 2 0 0 1 .73 2.25l-3.04 9.26a2 2 0 0 1-1.9 1.37H7.04a2 2 0 0 1-1.9-1.37L2.1 10.37a2 2 0 0 1 .73-2.25z"
          />
        </svg>
      </button>
      <button
        class="hud-vbtn"
        id="btnEditGeom"
        onclick="toggleVertexEditMode()"
        data-tip="Edit Nodes"
        title="Vertex Tool"
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"
          />
          <path d="m15 5 4 4" />
        </svg>
      </button>
      <button
        class="hud-vbtn hud-vbtn-del"
        id="btnDelete"
        onclick="deleteSelectedFeatures()"
        data-tip="Delete Selected Features (Del)"
        title="Delete Selected"
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 6h18" />
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
          <line x1="10" x2="10" y1="11" y2="17" />
          <line x1="14" x2="14" y1="11" y2="17" />
        </svg>
      </button>

      <div class="hud-vdivider"></div>

      <button
        class="hud-vbtn"
        id="btnMeasure"
        onclick="toggleMeasure()"
        data-tip="Measure"
        title="Measure"
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M21.3 8.7 8.7 21.3c-1 1-2.5 1-3.4 0l-2.6-2.6c-1-1-1-2.5 0-3.4L15.3 2.7c1-1 2.5-1 3.4 0l2.6 2.6c1 1 1 2.5 0 3.4Z"
          />
          <path d="m14.5 3.5 2 2" />
          <path d="m11.5 6.5 2 2" />
          <path d="m8.5 9.5 2 2" />
          <path d="m5.5 12.5 2 2" />
        </svg>
      </button>
      <button
        class="hud-vbtn"
        id="btnSnapshot"
        onclick="captureMapSnapshot()"
        data-tip="Snapshot"
        title="Snapshot"
      >
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"
          />
          <circle cx="12" cy="13" r="3" />
        </svg>
      </button>
    </div>

    <script>
      var map = L.map("map", {
        preferCanvas: true,
        zoomControl: true,
        attributionControl: false,
        boxZoom: false,
        doubleClickZoom: false,
      }).setView([39.0, 35.0], 5);

      L.control.scale({ imperial: false, position: "bottomleft" }).addTo(map);

      var coordsControl = L.control({ position: "bottomleft" });
      coordsControl.onAdd = function () {
        var div = L.DomUtil.create("div", "hud-coords-control");
        div.id = "hudCoordinates";
        div.title = "Click to copy coordinates";
        div.innerText = "39.0000° N, 35.0000° E";
        L.DomEvent.disableClickPropagation(div);
        div.onclick = copyMapCoordinates;
        return div;
      };
      coordsControl.addTo(map);

      var sharedCanvas = L.canvas({ padding: 0.5, tolerance: 10 });

      var freeTiles = {
        osm: L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
        }),
        sat: L.tileLayer(
          "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
          { maxZoom: 18 },
        ),
        topo: L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
          maxZoom: 17,
        }),
        dark: L.tileLayer(
          "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
          { maxZoom: 19 },
        ),
        none: null,
      };

      function applyTileFilter(type) {
        var tilePane = map.getPane("tilePane");
        if (!tilePane) return;
        if (type === "dark") {
          tilePane.style.filter =
            "invert(100%) hue-rotate(180deg) brightness(85%) contrast(90%)";
        } else {
          tilePane.style.filter = "";
        }
      }

      var currentBase = "osm";
      if (freeTiles[currentBase]) freeTiles[currentBase].addTo(map);
      applyTileFilter(currentBase);

      function setBaseMap(type) {
        if (freeTiles[currentBase]) map.removeLayer(freeTiles[currentBase]);
        currentBase = type;
        if (freeTiles[type]) freeTiles[type].addTo(map);
        applyTileFilter(type);
        bringVectorsToFront();
      }

      var geojsonLayer = null;
      var layerIndexMap = {};
      var currentOpacity = 0.85;
      var pyBridge = null;
      var wmsLayers = {};

      function setupBridge() {
        if (
          typeof QWebChannel !== "undefined" &&
          typeof qt !== "undefined" &&
          qt.webChannelTransport
        ) {
          new QWebChannel(qt.webChannelTransport, function (channel) {
            pyBridge = channel.objects.mapBridge;
          });
        } else {
          setTimeout(setupBridge, 100);
        }
      }
      setupBridge();

      function toggleTableHud() {
        if (pyBridge && pyBridge.toggleTable) {
          pyBridge.toggleTable();
        }
      }

      function setTableButtonActive(active) {
        var btn = document.getElementById("btnTable");
        if (btn) {
          if (active) btn.classList.add("active");
          else btn.classList.remove("active");
        }
      }

      var vectorLayers = {};
      var activeLayerId = null;
      var selectedFeatureLayerId = null;
      var wmsRegistry = {};

      var selectMode = "click";
      var selectedIndices = new Set();
      var isBoxSelecting = false;
      var boxStartLatLng = null;
      var boxRectLayer = null;
      var lastFeatureClickTime = 0;
      var lastClickedFeatureIdx = null;

      var LAYER_PALETTE = [
        "#0078d4", // Blue
        "#e67e22", // Amber
        "#2ecc71", // Emerald
        "#9b59b6", // Purple
        "#e74c3c", // Red
        "#1abc9c", // Teal
        "#f39c12", // Orange
        "#e84393", // Pink
        "#00cec9", // Cyan
        "#6c5ce7", // Violet
      ];

      function toggleLayersFlyout() {
        var lFlyout = document.getElementById("layersFlyout");
        var isOpen = false;
        if (lFlyout) {
          isOpen = lFlyout.classList.toggle("open");
          var btn = document.getElementById("btnLayers");
          if (btn) btn.classList.toggle("active", isOpen);
        }
        if (isOpen) renderLayersPanel();
      }

      function closeAllFlyouts() {
        var lFlyout = document.getElementById("layersFlyout");
        if (lFlyout) lFlyout.classList.remove("open");
        var btnL = document.getElementById("btnLayers");
        if (btnL) btnL.classList.remove("active");
      }

      function setActiveVectorInfo(name, count) {
        if (activeLayerId && vectorLayers[activeLayerId]) {
          vectorLayers[activeLayerId].name = name;
          vectorLayers[activeLayerId].count = count;
        }
        renderLayersPanel();
      }

      function toggleVectorVisibility(visible) {
        if (activeLayerId) {
          setVectorLayerVisibility(activeLayerId, visible);
        }
      }

      function requestAddService() {
        if (pyBridge && pyBridge.requestAddService) {
          pyBridge.requestAddService();
        }
      }

      function removeWms(layerId) {
        removeWmsLayer(layerId);
        if (pyBridge && pyBridge.onWmsDeleted) {
          pyBridge.onWmsDeleted(layerId);
        }
      }

      function toggleWmsVisibility(layerId, visible) {
        setWmsVisibility(layerId, visible);
      }

      function getLayerSymbolHtml(geomType, color) {
        var c = color || "#0078d4";
        var gt = (geomType || "any").toLowerCase();
        if (gt === "point") {
          return (
            '<span class="hud-layer-symbology" title="Point Layer">' +
            '<svg width="15" height="15" viewBox="0 0 15 15">' +
            '<circle cx="7.5" cy="7.5" r="4.5" fill="' +
            c +
            '" stroke="#ffffff" stroke-width="1.2"/>' +
            "</svg></span>"
          );
        } else if (gt === "line") {
          return (
            '<span class="hud-layer-symbology" title="Line Layer">' +
            '<svg width="15" height="15" viewBox="0 0 15 15">' +
            '<path d="M 2 12 L 6.5 3.5 L 13 8" fill="none" stroke="' +
            c +
            '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
            "</svg></span>"
          );
        } else if (gt === "polygon") {
          return (
            '<span class="hud-layer-symbology" title="Polygon Layer">' +
            '<svg width="15" height="15" viewBox="0 0 15 15">' +
            '<polygon points="2.5,4.5 9.5,2 13,8 5,12.5" fill="' +
            c +
            '" fill-opacity="0.45" stroke="' +
            c +
            '" stroke-width="1.8" stroke-linejoin="round"/>' +
            "</svg></span>"
          );
        } else {
          return (
            '<span class="hud-layer-symbology" title="Mixed Layer">' +
            '<svg width="15" height="15" viewBox="0 0 15 15">' +
            '<polygon points="1.5,5.5 7,2 11.5,6.5 6,12" fill="' +
            c +
            '" fill-opacity="0.35" stroke="' +
            c +
            '" stroke-width="1.4"/>' +
            '<circle cx="10" cy="4" r="2.2" fill="' +
            c +
            '" stroke="#ffffff" stroke-width="0.8"/>' +
            "</svg></span>"
          );
        }
      }

      function getWmsSymbolHtml() {
        return (
          '<span class="hud-layer-symbology" title="WMS / Map Service">' +
          '<svg width="15" height="15" viewBox="0 0 15 15">' +
          '<circle cx="7.5" cy="7.5" r="5.5" fill="none" stroke="#38bdf8" stroke-width="1.2"/>' +
          '<ellipse cx="7.5" cy="7.5" rx="2.5" ry="5.5" fill="none" stroke="#38bdf8" stroke-width="1.0"/>' +
          '<line x1="2" y1="7.5" x2="13" y2="7.5" stroke="#38bdf8" stroke-width="1.0"/>' +
          "</svg></span>"
        );
      }

      function renderLayersPanel() {
        var container = document.getElementById("layersListContainer");
        if (!container) return;

        var vKeys = Object.keys(vectorLayers);
        var wKeys = Object.keys(wmsRegistry);
        var totalCount = vKeys.length + wKeys.length;

        if (totalCount === 0) {
          container.innerHTML =
            '<div style="color: #858585; font-size: 11px; padding: 8px 4px; text-align: center;">(No layers or services)</div>';
          return;
        }

        var html = "";

        if (vKeys.length > 0) {
          vKeys.forEach(function (k) {
            var l = vectorLayers[k];
            var chk = l.visible ? "checked" : "";
            var symHtml = getLayerSymbolHtml(l.geomType, l.color);
            var countStr =
              l.count > 0
                ? ' <span style="color:#858585; font-size:10px;">(' +
                  l.count.toLocaleString() +
                  ")</span>"
                : "";
            var isWfs =
              l.isWfs ||
              (l.name &&
                (l.name.indexOf("(WFS)") !== -1 ||
                  l.name.indexOf("[WFS]") !== -1 ||
                  l.name.indexOf("WFS") !== -1));
            var tagHtml = isWfs
              ? '<span class="hud-layer-tag wfs-tag" title="WFS Service">WFS</span> '
              : "";

            html +=
              '<div class="hud-layer-item' +
              (l.isActive ? " active-layer" : "") +
              '" onclick="requestSetActiveLayer(\x27' +
              l.id +
              '\x27)" title="' +
              l.name +
              (l.isActive ? " (Active)" : "") +
              '">' +
              '<input type="checkbox" ' +
              chk +
              ' onclick="event.stopPropagation();" onchange="setVectorLayerVisibility(\x27' +
              l.id +
              '\x27, this.checked)" title="Visibility"/>' +
              symHtml +
              tagHtml +
              '<span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; font-size:11px;' +
              (l.isActive ? " font-weight:600; color:#4cc2ff;" : "") +
              '">' +
              l.name +
              countStr +
              "</span>" +
              '<button class="hud-layer-btn-del" onclick="event.stopPropagation(); removeVectorLayerUi(\x27' +
              l.id +
              '\x27)" title="Remove Layer">✕</button>' +
              "</div>";
          });
        }

        if (wKeys.length > 0) {
          if (vKeys.length > 0) {
            html +=
              '<div style="height:1px; background:rgba(255,255,255,0.08); margin:6px 0 4px 0;"></div>';
          }
          html +=
            '<div class="hud-layers-section-header">🌐 WMS & Services</div>';
          wKeys.forEach(function (k) {
            var layer = wmsRegistry[k];
            var chk = layer.visible ? "checked" : "";
            var title = layer.title || layer.layerName;
            var wmsSym = getWmsSymbolHtml();
            var tagHtml =
              '<span class="hud-layer-tag wms-tag" title="WMS / Map Service">WMS</span> ';
            html +=
              '<div class="hud-layer-item" title="' +
              title +
              '">' +
              '<input type="checkbox" ' +
              chk +
              ' onclick="event.stopPropagation();" onchange="toggleWmsVisibility(\x27' +
              layer.id +
              '\x27, this.checked)" title="Visibility"/>' +
              wmsSym +
              tagHtml +
              '<span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; font-size:11px;">' +
              title +
              "</span>" +
              '<button class="hud-layer-btn-del" onclick="event.stopPropagation(); removeWms(\x27' +
              layer.id +
              '\x27)" title="Remove Service">✕</button>' +
              "</div>";
          });
        }

        container.innerHTML = html;
      }

      function addWmsLayer(layerId, url, layers, format, transparent, title) {
        if (wmsLayers[layerId]) map.removeLayer(wmsLayers[layerId]);
        if (url.indexOf("{z}") !== -1) {
          wmsLayers[layerId] = L.tileLayer(url, {
            maxZoom: 20,
          }).addTo(map);
        } else {
          wmsLayers[layerId] = L.tileLayer
            .wms(url, {
              layers: layers,
              format: format || "image/png",
              transparent: transparent !== false,
              maxZoom: 20,
            })
            .addTo(map);
        }
        wmsRegistry[layerId] = {
          id: layerId,
          title: title || layers,
          url: url,
          layerName: layers,
          visible: true,
        };
        bringVectorsToFront();
        renderLayersPanel();

        var lFlyout = document.getElementById("layersFlyout");
        var btnL = document.getElementById("btnLayers");
        if (lFlyout && !lFlyout.classList.contains("open")) {
          lFlyout.classList.add("open");
          if (btnL) btnL.classList.add("active");
        }
      }

      function removeWmsLayer(layerId) {
        if (wmsLayers[layerId]) {
          map.removeLayer(wmsLayers[layerId]);
          delete wmsLayers[layerId];
        }
        if (wmsRegistry[layerId]) {
          delete wmsRegistry[layerId];
        }
        renderLayersPanel();
      }

      function setWmsVisibility(layerId, visible) {
        if (wmsRegistry[layerId]) {
          wmsRegistry[layerId].visible = visible;
        }
        if (wmsLayers[layerId]) {
          if (visible) map.addLayer(wmsLayers[layerId]);
          else map.removeLayer(wmsLayers[layerId]);
          bringVectorsToFront();
        }
        renderLayersPanel();
      }

      function bringVectorsToFront() {
        Object.keys(vectorLayers).forEach(function (k) {
          var vl = vectorLayers[k];
          if (vl.leafletLayer && vl.visible) {
            vl.leafletLayer.bringToFront();
          }
        });
      }

      // --- Map Mouse Move & Coordinate Tracking ---
      map.on("mousemove", function (e) {
        if (isBoxSelecting && boxRectLayer && boxStartLatLng) {
          boxRectLayer.setBounds(L.latLngBounds(boxStartLatLng, e.latlng));
        }
        var coordsEl = document.getElementById("hudCoordinates");
        if (coordsEl && !coordsEl.classList.contains("copied")) {
          var lat = e.latlng.lat;
          var lng = e.latlng.lng;
          var latH = lat >= 0 ? "N" : "S";
          var lngH = lng >= 0 ? "E" : "W";
          coordsEl.setAttribute("data-lat", lat.toFixed(5));
          coordsEl.setAttribute("data-lng", lng.toFixed(5));
          coordsEl.innerText =
            Math.abs(lat).toFixed(4) +
            "° " +
            latH +
            ", " +
            Math.abs(lng).toFixed(4) +
            "° " +
            lngH;
        }
      });

      map.on("zoomend", function () {
        var coordsEl = document.getElementById("hudCoordinates");
        if (coordsEl && !coordsEl.classList.contains("copied")) {
          var c = map.getCenter();
          var lat = coordsEl.getAttribute("data-lat") || c.lat.toFixed(5);
          var lng = coordsEl.getAttribute("data-lng") || c.lng.toFixed(5);
          var latNum = parseFloat(lat);
          var lngNum = parseFloat(lng);
          var latH = latNum >= 0 ? "N" : "S";
          var lngH = lngNum >= 0 ? "E" : "W";
          coordsEl.innerText =
            Math.abs(latNum).toFixed(4) +
            "° " +
            latH +
            ", " +
            Math.abs(lngNum).toFixed(4) +
            "° " +
            lngH;
        }
      });

      function updateCoordinatesToMapCenter() {
        var coordsEl = document.getElementById("hudCoordinates");
        if (coordsEl && map) {
          var c = map.getCenter();
          var lat = c.lat;
          var lng = c.lng;
          var latH = lat >= 0 ? "N" : "S";
          var lngH = lng >= 0 ? "E" : "W";
          coordsEl.setAttribute("data-lat", lat.toFixed(5));
          coordsEl.setAttribute("data-lng", lng.toFixed(5));
          coordsEl.innerText =
            Math.abs(lat).toFixed(4) +
            "° " +
            latH +
            ", " +
            Math.abs(lng).toFixed(4) +
            "° " +
            lngH;
        }
      }

      function copyMapCoordinates() {
        var coordsEl = document.getElementById("hudCoordinates");
        if (!coordsEl) return;
        var c = map.getCenter();
        var lat = coordsEl.getAttribute("data-lat") || c.lat.toFixed(5);
        var lng = coordsEl.getAttribute("data-lng") || c.lng.toFixed(5);
        var text = lat + ", " + lng;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text);
        } else {
          var ta = document.createElement("textarea");
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
        }
        var origText = coordsEl.innerText;
        coordsEl.classList.add("copied");
        coordsEl.innerText = text + " (Copied)";
        setTimeout(function () {
          coordsEl.classList.remove("copied");
          coordsEl.innerText = origText;
        }, 1200);
      }

      var viewportDebounceTimer = null;
      map.on("moveend", function () {
        if (selectedIndices.size > 0 && activeLayerId) {
          refreshLayerStyles(activeLayerId);
        }
        if (viewportDebounceTimer) clearTimeout(viewportDebounceTimer);
        viewportDebounceTimer = setTimeout(function () {
          if (pyBridge && pyBridge.onViewportChanged) {
            var b = map.getBounds();
            var z = map.getZoom();
            pyBridge.onViewportChanged(
              b.getWest(),
              b.getSouth(),
              b.getEast(),
              b.getNorth(),
              z,
            );
          }
        }, 200);
      });

      // --- Geometry Addition & Drawing Modes ---
      var activeLayerGeomType = "any"; // 'point' | 'line' | 'polygon' | 'mixed' | 'any'
      var drawMode = null; // null | 'point' | 'line' | 'polygon'
      var polyDrawPoints = [];
      var polyDrawMarkers = [];
      var polyDrawLine = null;
      var polyDrawPoly = null;
      var selectedFeatureIndex = -1;

      function setLayerGeometryType(geomType) {
        activeLayerGeomType = (geomType || "any").toLowerCase();
        updateDrawButtonsUI();
        if (drawMode && !isDrawModeAllowed(drawMode)) {
          cancelDrawMode();
        }
      }

      function isDrawModeAllowed(mode) {
        if (activeLayerGeomType === "any" || activeLayerGeomType === "mixed")
          return true;
        if (mode === "point") return activeLayerGeomType === "point";
        if (mode === "line") return activeLayerGeomType === "line";
        if (mode === "polygon") return activeLayerGeomType === "polygon";
        return true;
      }

      function getLayerTypeNameTr(type) {
        if (type === "point") return "Point";
        if (type === "line") return "Line";
        if (type === "polygon") return "Polygon";
        return "Mixed";
      }

      function getDrawModeNameTr(mode) {
        if (mode === "point") return "Point";
        if (mode === "line") return "Line";
        if (mode === "polygon") return "Polygon";
        return mode;
      }

      function updateDrawButtonsUI() {
        var bPoint = document.getElementById("btnAddPoint");
        var bLine = document.getElementById("btnAddLine");
        var bPoly = document.getElementById("btnAddPolygon");
        var layerTr = getLayerTypeNameTr(activeLayerGeomType);

        if (bPoint) {
          if (isDrawModeAllowed("point")) {
            bPoint.classList.remove("disabled");
          } else {
            bPoint.classList.add("disabled");
          }
        }

        if (bLine) {
          if (isDrawModeAllowed("line")) {
            bLine.classList.remove("disabled");
            bLine.setAttribute("data-tip", "Add Line (Draw & Double Click)");
          } else {
            bLine.classList.add("disabled");
          }
        }

        if (bPoly) {
          if (isDrawModeAllowed("polygon")) {
            bPoly.classList.remove("disabled");
            bPoly.setAttribute("data-tip", "Add Polygon (Draw & Double Click)");
          } else {
            bPoly.classList.add("disabled");
          }
        }
      }

      function showWarningBanner(msg, duration) {
        console.warn(msg);
      }

      function toggleDrawMode(mode) {
        if (drawMode === mode) {
          cancelDrawMode();
          return;
        }

        if (!isDrawModeAllowed(mode)) {
          var layerName = getLayerTypeNameTr(activeLayerGeomType);
          var targetName = getDrawModeNameTr(mode);
          showWarningBanner(
            "⚠️ This layer is of type [" +
              layerName +
              "]. Cannot add " +
              targetName.toLowerCase() +
              "!",
          );
          return;
        }

        cancelDrawMode();
        if (typeof finishVertexEditMode === "function") finishVertexEditMode();
        if (selectMode === "box") setSelectTool("click");
        if (measureActive) toggleMeasure();
        closeAllFlyouts();
        drawMode = mode;

      function applyStyleToLayerItem(l, idx, lObj) {
        var isSelected = selectedIndices.has(idx);
        var baseColor = lObj.color;
        if (l.setRadius) {
          l.setRadius(isSelected ? 8.5 : 6);
          if (l.setStyle) {
            l.setStyle({
              fillColor: isSelected ? "#ffff00" : baseColor,
              color: isSelected ? "#b45309" : "#ffffff",
              weight: isSelected ? 3.0 : 1.5,
              opacity: 1.0,
              fillOpacity: isSelected ? 0.95 : currentOpacity * 0.9,
            });
          }
          if (isSelected && l.bringToFront) {
            try {
              l.bringToFront();
            } catch (e) {}
          }
        } else if (l.setStyle) {
          var gtype =
            (l.feature && l.feature.geometry && l.feature.geometry.type) ||
            (lObj.geomType === "line" ? "LineString" : "Polygon");
          var isLine = gtype.indexOf("Line") !== -1;
          if (isSelected) {
            l.setStyle({
              color: isLine ? "#eab308" : "#b45309",
              weight: isLine ? 5.0 : 3.5,
              opacity: 1.0,
              fillColor: "#ffff00",
              fillOpacity: isLine ? 0 : 0.65,
            });
          } else {
            l.setStyle({
              color: baseColor,
              weight: isLine ? 2.5 : 2,
              opacity: currentOpacity,
              fillColor: baseColor,
              fillOpacity: isLine ? 0 : currentOpacity * 0.35,
            });
          }
          if (isSelected && l.bringToFront) {
            try {
              l.bringToFront();
            } catch (e) {}
          }
        }
      }

      function refreshLayerStyles(layerId) {
        var lId = layerId || activeLayerId;
        if (!lId || !vectorLayers[lId]) return;
        var lObj = vectorLayers[lId];
        if (!lObj.leafletLayer) return;

        lObj.leafletLayer.eachLayer(function (l) {
          if (l.eachLayer) {
            l.eachLayer(function (child) {
              var cIdx =
                child._featureIdx !== undefined
                  ? child._featureIdx
                  : l._featureIdx;
              if (cIdx !== undefined) {
                applyStyleToLayerItem(child, cIdx, lObj);
              }
            });
          }
          var idx = l._featureIdx;
          if (idx !== undefined) {
            applyStyleToLayerItem(l, idx, lObj);
          }
        });
        updateSelectionUI();
      }

      function findFeatureAtPoint(cPoint, latlng, layerId) {
        var lId = layerId || activeLayerId;
        if (!lId || !vectorLayers[lId]) return null;
        var lObj = vectorLayers[lId];
        if (!lObj.indexMap) return null;

        var layerPt = map.containerPointToLayerPoint(cPoint);
        var bestHit = null;
        var bestDist = Infinity;

        var keys = Object.keys(lObj.indexMap);
        for (var i = 0; i < keys.length; i++) {
          var idx = parseInt(keys[i], 10);
          var l = lObj.indexMap[idx];
          if (!l) continue;

          if (l.getLatLng) {
            var pt = map.latLngToContainerPoint(l.getLatLng());
            var d = Math.hypot(pt.x - cPoint.x, pt.y - cPoint.y);
            var r = (l.options && l.options.radius) || 6;
            var tol = Math.max(r, 6) + 8;
            if (d <= tol && d < bestDist) {
              bestDist = d;
              bestHit = { idx: idx, layer: l, feature: l.feature };
            }
            continue;
          }

          if (l.eachLayer) {
            var hitInGroup = false;
            l.eachLayer(function (child) {
              if (hitInGroup) return;
              if (child.getLatLng) {
                var cp = map.latLngToContainerPoint(child.getLatLng());
                var cd = Math.hypot(cp.x - cPoint.x, cp.y - cPoint.y);
                var cr = (child.options && child.options.radius) || 6;
                var ctol = Math.max(cr, 6) + 8;
                if (cd <= ctol && cd < bestDist) {
                  bestDist = cd;
                  bestHit = {
                    idx: idx,
                    layer: child,
                    feature: child.feature || l.feature,
                  };
                  hitInGroup = true;
                }
              } else if (child._containsPoint && child._containsPoint(layerPt)) {
                bestDist = 0;
                bestHit = {
                  idx: idx,
                  layer: child,
                  feature: child.feature || l.feature,
                };
                hitInGroup = true;
              }
            });
            if (hitInGroup && bestDist === 0) return bestHit;
          }

          if (l._containsPoint && l._containsPoint(layerPt)) {
            return { idx: idx, layer: l, feature: l.feature };
          }

          if (l.getLatLngs) {
            var latlngs = l.getLatLngs();
            var isLine =
              lObj.geomType === "line" ||
              (l.feature &&
                l.feature.geometry &&
                l.feature.geometry.type.indexOf("Line") !== -1);
            if (isLine && Array.isArray(latlngs)) {
              var checkLineDist = function (coords) {
                if (!Array.isArray(coords) || coords.length < 2) return Infinity;
                var minDist = Infinity;
                for (var j = 0; j < coords.length - 1; j++) {
                  if (coords[j] && coords[j + 1] && coords[j].lat !== undefined) {
                    var pA = map.latLngToContainerPoint(coords[j]);
                    var pB = map.latLngToContainerPoint(coords[j + 1]);
                    var l2 =
                      Math.pow(pB.x - pA.x, 2) + Math.pow(pB.y - pA.y, 2);
                    var t =
                      l2 === 0
                        ? 0
                        : Math.max(
                            0,
                            Math.min(
                              1,
                              ((cPoint.x - pA.x) * (pB.x - pA.x) +
                                (cPoint.y - pA.y) * (pB.y - pA.y)) /
                                l2,
                            ),
                          );
                    var projX = pA.x + t * (pB.x - pA.x);
                    var projY = pA.y + t * (pB.y - pA.y);
                    var segDist = Math.hypot(cPoint.x - projX, cPoint.y - projY);
                    if (segDist < minDist) minDist = segDist;
                  }
                }
                return minDist;
              };

              var ld = checkLineDist(latlngs);
              if (ld <= 12 && ld < bestDist) {
                bestDist = ld;
                bestHit = { idx: idx, layer: l, feature: l.feature };
              }
            }
          }
        }
        return bestHit;
      }

      function setSelectedFeatures(indices, layerId) {
        var lId = layerId || activeLayerId;
        if (!lId || !vectorLayers[lId]) return;
        selectedIndices.clear();
        if (Array.isArray(indices)) {
          indices.forEach(function (i) {
            selectedIndices.add(i);
          });
        }
        selectedFeatureIndex = selectedIndices.size === 1 ? indices[0] : -1;
        selectedFeatureLayerId = lId;
        refreshLayerStyles(lId);
        if (vertexEditActive) {
          if (selectedIndices.size === 1) {
            attachVertexHandles(lId, selectedFeatureIndex);
          } else {
            clearVertexHandles();
          }
        }
      }

      function clearSelection() {
        if (vertexEditActive) finishVertexEditMode();
        if (selectedIndices.size === 0) return;
        selectedIndices.clear();
        selectedFeatureIndex = -1;
        refreshLayerStyles(activeLayerId);
        if (map.closePopup) map.closePopup();
        notifySelectionChanged();
      }

      function zoomToSelected(layerId) {
        if (selectedIndices.size === 0) return;
        var lId = layerId || activeLayerId;
        var lObj = vectorLayers[lId];
        if (!lObj) return;

        var b = L.latLngBounds();
        var hasAny = false;
        selectedIndices.forEach(function (idx) {
          var l = lObj.indexMap[idx];
          if (l) {
            if (l.getBounds && l.getBounds().isValid()) {
              b.extend(l.getBounds());
              hasAny = true;
            } else if (l.getLatLng) {
              b.extend(l.getLatLng());
              hasAny = true;
            }
          }
        });

        if (hasAny && b.isValid()) {
          var sw = b.getSouthWest();
          var ne = b.getNorthEast();
          if (sw.lat === ne.lat && sw.lng === ne.lng) {
            map.setView(sw, Math.max(map.getZoom(), 16), { animate: true });
          } else {
            map.fitBounds(b, { maxZoom: 17, padding: [50, 50], animate: true });
          }
        }
      }

        if (map.closePopup) map.closePopup();

          pyBridge.onSelectionDeleted(JSON.stringify(arr));

        selectedIndices.clear();
        selectedFeatureIndex = -1;
        refreshLayerStyles(activeLayerId);

        if (selectedIndices.size === 1) {
          var idx = Array.from(selectedIndices)[0];

        } else if (selectedIndices.size > 1) {
        } else {
        }

      function clearVertexHandles() {

      function notifyFeatureUpdated(featureIdx, geom) {
        if (pyBridge && pyBridge.onFeatureUpdated) {
          pyBridge.onFeatureUpdated(featureIdx, JSON.stringify(geom));
